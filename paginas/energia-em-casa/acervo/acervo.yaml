# ACERVO VISUAL BRASILEIRO
# ---------------------------------------------------------------------------------------------
# A IA de imagem não conhece o padrão brasileiro: sozinha, ela desenha tomada americana, chuveiro
# a gás, plugue de pino chato. Aqui ficam FOTOS REAIS de referência (licença livre, com crédito).
# Quando a cena fala de um destes objetos, o robô mostra a foto para a IA (FLUX.2) e pede a
# ilustração no estilo da página COM O OBJETO IGUAL AO DA FOTO. Depois o fiscal confere.
#
# Como acrescentar um objeto: peça ao Claude "rodar o rs-pesquisador-visual para <objeto>".
#
# Campos:
#   gatilhos   expressões (regex, sem diferenciar maiúsculas) procuradas na FALA e na descrição da cena
#   cenas      descrições (inglês) usadas em rodízio; sempre mantêm o objeto igual ao da referência
#   cenas_mascote  ações (inglês) do MASCOTE com o objeto (2ª referência), usadas quando o mascote aparece na cena
#   conferir   o que o fiscal de imagem exige ver (português); fora disso, reprova
#   norma      norma/regra brasileira que define o objeto (para o pesquisador e para consulta)
# ---------------------------------------------------------------------------------------------
objetos:
  - id: tomada
    referencia: tomada_nbr14136.jpg
    norma: "ABNT NBR 14136 (padrão brasileiro de plugues e tomadas, obrigatório desde 2011)"
    gatilhos:
      - 'tomadas?'
      - '\b(wall )?(socket|outlet|receptacle)s?\b'
    cenas:
      - "Close-up of the exact same power socket from the reference image (hexagonal recess with exactly three identical round holes: left, right, and one in the middle slightly lower; no slots, no other openings), mounted on a wall of a cozy Brazilian home"
      - "Keep the wall socket from the reference image exactly as it is (same hexagonal shape, same three round holes in the same positions), on a kitchen wall above a countertop in a Brazilian home, no plug, no hands"
      - "The exact same wall socket from the reference image (hexagonal recess, three round holes), low on a bedroom wall in a Brazilian home at dusk, soft golden light, no plug, no hands"
    cenas_mascote:
      - "crouching next to a wall and pointing at the wall power socket from the second reference image (hexagonal recess with exactly three round holes), in a cozy Brazilian living room. Keep the socket faithful to the second reference"
      - "standing beside a wall, showing with an open hand the wall power socket from the second reference image (hexagonal recess with exactly three round holes), in a Brazilian kitchen. Keep the socket faithful to the second reference"
    conferir: "A tomada deve ser do padrão brasileiro: recesso em forma de hexágono alongado com exatamente 3 furos REDONDOS (um à esquerda, um à direita e um no meio um pouco deslocado). Reprove se tiver fendas retas/retangulares (padrão americano), furo em T, 2 fendas + 1 furo, ou qualquer outro padrão."
    fonte: "https://commons.wikimedia.org/wiki/File:Brazilian_3-pin_socket_20A.jpg"
    credito: "Sylx (Wikimedia Commons)"
    licenca: "Domínio público"

  - id: plugue
    referencia: plugue_3pinos.jpg
    norma: "ABNT NBR 14136 (plugue de 2 ou 3 pinos redondos; o pino do meio é o terra)"
    gatilhos:
      - 'plugues?'
      - 'tr[êe]s pinos|3 pinos|terceiro pino|pino (do meio|terra|central)|pinos'
      - '\bplugs?\b|\bprongs?\b|\bpins?\b'
    cenas:
      - "The black power plug from the reference image, same shape: flat black body with exactly three round metal pins in a row, lying on a wooden table in a cozy Brazilian living room, close-up, pins clearly visible from the front. Keep the plug identical to the reference"
      - "The black three-pin power plug from the reference image (exactly three round cylindrical metal pins side by side in a row), held up by a hand against a softly blurred Brazilian kitchen, pins pointing at the camera. Keep the plug identical to the reference"
    cenas_mascote:
      - "holding up in one hand the black three-pin power plug from the second reference image (exactly three round metal pins in a row), showing it to the viewer, in a cozy Brazilian living room. Keep the plug faithful to the second reference"
    conferir: "O plugue deve ser do padrão brasileiro: pinos REDONDOS (cilíndricos), 2 ou 3, alinhados em fila. Reprove se tiver pinos chatos/lâminas (padrão americano), pinos retangulares (britânico) ou mais de 3 pinos."
    fonte: "https://commons.wikimedia.org/wiki/File:NBR_14136_plugs_and_outlet.jpg"
    credito: "Fasouzafreitas (Wikimedia Commons) — recorte"
    licenca: "CC BY-SA 3.0"

  - id: chuveiro
    referencia: chuveiro_eletrico.jpg
    norma: "Chuveiro elétrico (aquecimento instantâneo no próprio chuveiro; ligação com fio terra conforme ABNT NBR 5410)"
    gatilhos:
      - 'chuveiros?|ducha|banho'
      - '\bshowers?\b'
    cenas:
      - "The white electric shower head from the reference image (Brazilian electric shower: round white plastic shower head on a short pipe arm coming out of a tiled bathroom wall), with warm water falling and light steam, clean modern Brazilian bathroom. Same shower head shape as the reference, no exposed wires"
      - "The same white Brazilian electric shower head from the reference image, seen from below, water drops falling, tiled bathroom wall behind, soft warm light. Same shower head shape as the reference, no exposed wires, no people"
    cenas_mascote:
      - "standing in a Brazilian bathroom and pointing up at the white electric shower head from the second reference image (round white plastic shower head on a short pipe arm on a tiled wall). Keep the shower head faithful to the second reference"
      - "standing in a tiled Brazilian bathroom, looking up with a friendly smile at the white electric shower head from the second reference image with warm water falling. Keep the shower head faithful to the second reference"
    conferir: "O chuveiro deve ser um chuveiro elétrico brasileiro: cabeça redonda de plástico branco (ou clara) presa a um braço/cano curto na parede. Reprove se for ducha metálica de hotel, chuveiro de teto embutido, banheira, aquecedor a gás ou se aparecer pessoa sem roupa."
    fonte: "https://commons.wikimedia.org/wiki/File:At_Paraty_2023_022.jpg"
    credito: "Mike Peel, www.mikepeel.net (Wikimedia Commons)"
    licenca: "CC BY-SA 4.0"

  - id: quadro_disjuntores
    referencia: quadro_disjuntores.jpg
    norma: "ABNT NBR 5410 (instalações elétricas de baixa tensão: quadro de distribuição com um disjuntor por circuito e DR) e ABNT NBR NM 60898 (minidisjuntores modulares, montados em trilho DIN)"
    gatilhos:
      - 'quadros? de (luz|disjuntor\w*|distribui\w+|for[çc]a)|disjuntor\w*|minidisjuntor\w*'
      - '\b(breaker|fuse) ?(box|panel)s?\b|circuit breakers?|electrical panels?|consumer units?|distribution boards?'
    cenas:
      - "The exact same white residential circuit breaker panel from the reference image (white plastic enclosure on the wall, one horizontal row of narrow modular DIN-rail circuit breakers with small toggle levers, white front cover around them), on a hallway wall of a cozy Brazilian home, close-up. Plain breakers with no labels, no stickers and no writing"
      - "Keep the circuit breaker panel from the reference image exactly as it is (white box, single row of narrow DIN-rail breakers with toggle levers), door open, on a light painted wall in a Brazilian laundry area, soft daylight, no hands. Plain breakers with no labels and no writing"
      - "The same white breaker panel from the reference image seen slightly from the side, the row of narrow DIN-rail circuit breakers with their small levers clearly visible, warm evening light in a Brazilian home, no people. Plain white surfaces with no labels and no writing"
    cenas_mascote:
      - "standing next to a wall and pointing at the white circuit breaker panel from the second reference image (white box with one row of narrow DIN-rail breakers with toggle levers), in a Brazilian home hallway. Keep the panel faithful to the second reference, plain breakers with no labels and no writing"
      - "opening the door of the white circuit breaker panel from the second reference image (one row of narrow DIN-rail breakers with toggle levers) on a wall of a Brazilian home, looking at the viewer with a friendly smile. Keep the panel faithful to the second reference, plain breakers with no labels and no writing"
    conferir: "Deve aparecer um quadro de distribuição residencial: caixa na parede (geralmente branca) com disjuntores MODULARES tipo DIN (peças retangulares estreitas, lado a lado em fileira, cada uma com uma alavanca). Reprove se tiver fusíveis de rosca ou cartucho, chave faca, painel norte-americano (disjuntores pretos de encaixe em duas colunas atrás de porta de metal cinza), ou etiquetas/textos legíveis."
    fonte: "https://commons.wikimedia.org/wiki/File:Fuse_box_fixing_is_ready.JPG"
    credito: "Dmitry G (Wikimedia Commons) — recorte"
    licenca: "Domínio público"

  - id: medidor_energia
    referencia: medidor_energia.jpg
    norma: "Medidor de energia da distribuidora (relógio de luz), com modelo aprovado pelo Inmetro; medição regulada pela ANEEL (REN 1.000/2021); instalado na caixa de medição do padrão de entrada, conforme a norma técnica da distribuidora local"
    gatilhos:
      - 'medidor(es)? (de |da )?(energia|luz|consumo|kwh)|rel[óo]gios? (de|da) (luz|energia|for[çc]a)|leitura do (rel[óo]gio|medidor)|padr[ãa]o de entrada|caixa de medi[çc][ãa]o'
      - '\b(electricity|electric|power|energy|kwh|utility) meters?\b|\bmeter box(es)?\b|\bmeter reading\b'
    cenas:
      - "The exact same household electricity meter from the reference image: black rectangular body with a black lower terminal cover, gray faceplate behind glass with a dark strip holding a row of six small EMPTY light-gray counter windows, and below a thin horizontal window showing the edge of a rotating metal disc with an arrow. It hangs on the inner wall of a gray metal meter box with an open door, at the front wall of a Brazilian house. The six counter windows are empty, with no digits. No labels, no stickers, no writing"
      - "Close-up of the same household electricity meter from the reference image (black body, gray faceplate, dark strip with a row of six small EMPTY counter windows, thin window with a rotating metal disc), mounted on a painted wall at the entrance of a Brazilian home, afternoon sun. The counter windows are blank with no digits, the faceplate has no text, no labels"
      - "The same household electricity meter from the reference image (black body, gray faceplate, row of six small EMPTY counter windows on a dark strip, thin rotating disc window) inside a small gray meter cabinet with a clear glass door, on a garden wall in front of a Brazilian house, tropical plants nearby. Blank counter windows with no numbers, no writing, no logos, no stickers"
    cenas_mascote:
      - "standing beside a garden wall and pointing at the household electricity meter from the second reference image (black body, gray faceplate, row of six small EMPTY counter windows with no digits, thin rotating disc window) inside a gray meter box with an open door, in front of a Brazilian house. Keep the meter faithful to the second reference, no numbers, no writing"
      - "standing in front of a Brazilian house and looking with curiosity at the household electricity meter from the second reference image (black body, gray faceplate, row of six small EMPTY counter windows with no digits) inside a gray meter box on the wall. Keep the meter faithful to the second reference, no numbers, no writing"
    conferir: "Deve aparecer um medidor de energia residencial (relógio de luz) reconhecível: caixa retangular com mostrador e contador na parede ou dentro de uma caixa de medição com visor. O contador/visor deve estar em branco ou sem dígitos legíveis. Reprove se aparecer QUALQUER número ou texto legível no visor, em etiquetas ou adesivos, se for medidor redondo norte-americano (cúpula de vidro sobre base redonda) ou se for medidor de água/gás."
    fonte: "https://commons.wikimedia.org/wiki/File:Siemens_household_electricity_meter_electromechanical_induction_type.jpg"
    credito: "RobbieIanMorrison (Wikimedia Commons) — recorte, com textos e números apagados"
    licenca: "CC BY 4.0"

  - id: poste
    referencia: poste_transformador.jpg
    norma: "ABNT NBR 8451 (postes de concreto armado e protendido para redes de distribuição); rede aérea urbana com transformador no poste, no padrão da distribuidora local"
    gatilhos:
      - '\bpostes?\b|\btransformador(es)?\b|rede (el[ée]trica )?a[ée]rea|fios? (da rua|do poste)'
      - '\b(utility|power|electric|telephone) poles?\b|\btransformers?\b|\bpower lines?\b'
    cenas:
      - "The exact same gray concrete utility pole from the reference image with the gray pole-mounted distribution transformer and many horizontal power lines, on a sunny residential street in a Brazilian city, low angle, blue sky with white clouds. No signs, no writing"
      - "Keep the concrete pole and transformer from the reference image exactly as they are (gray concrete pole, gray transformer with cooling fins and insulators on top, wires around it), on a Brazilian neighborhood sidewalk at golden hour, small houses with colorful walls, no people. No signs, no writing"
      - "The same gray concrete utility pole from the reference image with its transformer and power lines, seen from the street of a quiet Brazilian town, tropical trees, soft afternoon light, no people, no cars. No signs, no writing"
    cenas_mascote:
      - "standing on a Brazilian sidewalk at a safe distance and pointing up at the gray concrete utility pole with the transformer from the second reference image, power lines above. Keep the pole and transformer faithful to the second reference"
      - "standing on a quiet Brazilian street, looking at the viewer and showing with an open hand the gray concrete utility pole with transformer from the second reference image behind. Keep the pole faithful to the second reference"
    conferir: "O poste deve ser do padrão urbano brasileiro: poste de CONCRETO cinza (seção duplo T ou redonda) com fios e, se houver, transformador cinza preso ao poste. Reprove se o poste for de madeira escura com cruzetas em forma de cruz (padrão norte-americano), se houver placas ou textos legíveis, ou se alguém estiver subindo no poste."
    fonte: "https://commons.wikimedia.org/wiki/File:Transformador_de_distribui%C3%A7%C3%A3o.JPG"
    credito: "Richard Melo da Silva (Wikimedia Commons)"
    licenca: "CC BY-SA 3.0"

# Objetos que a IA costuma desenhar no padrão ERRADO e que ainda NÃO têm foto de referência:
# a cena é trocada por uma cena segura (até o rs-pesquisador-visual trazer a referência).
sem_referencia:
  - 'benjamim|adaptador\w*|filtro de linha|extens[ãa]o|r[ée]gua|power strips?|extension cords?|adapters?'
  - 'dinheiro|c[ée]dulas?|notas? de|moedas?|\b(coins?|banknotes?|cash|money|wallet)\b'

# Regra geral do fiscal para TODAS as imagens da página
regra_geral: >-
  A cena se passa no BRASIL. Reprove se aparecer: tomada ou plugue fora do padrão brasileiro (fendas retas,
  pinos chatos, tomada de parede com só 2 furos — a tomada brasileira tem sempre 3 furos redondos), placas ou objetos com escrita em outra língua, dinheiro estrangeiro (dólar, euro),
  bandeira de outro país, neve, ou casa/rua tipicamente norte-americana.
