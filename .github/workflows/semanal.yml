# Toda segunda às 08:00 (Brasília): coleta métricas, ajusta temas/horários e gera o relatório semanal.
name: semanal
on:
  # Os horários ficam no despertador da Cloudflare (despertador-cloudflare/): o agendador do GitHub atrasava horas.
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: estado, cancel-in-progress: false}
jobs:
  semanal:
    uses: ./.github/workflows/_preparar.yml
    with:
      comando: semanal
    secrets: inherit
