# Todo dia às 23:00 (Brasília): gera os posts do DIA SEGUINTE e manda as prévias no Telegram.
# Sexta às 23:30: gera também o vídeo longo de sábado.
name: diario
on:
  schedule:
    - cron: "7 1 * * *"     # 22:07 BRT (01:07 UTC): minuto "quebrado" e mais cedo, porque o GitHub atrasa horas cheias
    - cron: "37 1 * * 6"    # 22:37 BRT de sexta (vídeo longo de sábado)
  workflow_dispatch:
    inputs:
      formato:
        description: "short ou longo"
        default: short
permissions:
  contents: write
concurrency: {group: estado, cancel-in-progress: false}
jobs:
  gerar:
    uses: ./.github/workflows/_preparar.yml
    with:
      comando: >-
        gerar --formato ${{ github.event.inputs.formato || (github.event.schedule == '37 1 * * 6' && 'longo') || 'short' }}
    secrets: inherit
