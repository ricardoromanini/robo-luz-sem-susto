# Todo dia às 23:00 (Brasília): gera os posts do DIA SEGUINTE e manda as prévias no Telegram.
# Sexta às 23:30: gera também o vídeo longo de sábado.
name: diario
on:
  schedule:
    - cron: "0 2 * * *"     # 23:00 BRT (02:00 UTC)
    - cron: "30 2 * * 6"    # 23:30 BRT de sexta (vídeo longo de sábado)
  workflow_dispatch:
    inputs:
      formato:
        description: "short ou longo"
        default: short
permissions:
  contents: write
concurrency: {group: estado, cancel-in-progress: false}
jobs:
  gerar:
    uses: ./.github/workflows/_preparar.yml
    with:
      comando: >-
        gerar --formato ${{ github.event.inputs.formato || (github.event.schedule == '30 2 * * 6' && 'longo') || 'short' }}
    secrets: inherit
